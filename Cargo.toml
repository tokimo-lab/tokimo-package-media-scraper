[workspace]
members = ["."]
resolver = "2"

[workspace.package]
rust-version = "1.94.0"

[workspace.lints.rust]
unsafe_code     = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
wildcard_imports          = "allow"
module_name_repetitions   = "allow"
must_use_candidate        = "allow"
missing_errors_doc        = "allow"
missing_panics_doc        = "allow"
items_after_statements    = "allow"
struct_excessive_bools    = "allow"
similar_names             = "allow"
many_single_char_names    = "allow"
unnecessary_literal_bound = "allow"
doc_markdown              = "allow"
ref_option                = "allow"
fn_params_excessive_bools = "allow"
needless_pass_by_value    = "allow"
cast_possible_wrap        = "allow"
cast_possible_truncation  = "allow"
cast_precision_loss       = "allow"
cast_sign_loss            = "allow"
unwrap_in_result          = "warn"
panic                     = "warn"
todo                      = "warn"
dbg_macro                 = "warn"
print_stdout              = "warn"
print_stderr              = "warn"

[package]
name        = "tokimo-media-scraper"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
description = "Metadata scraping clients for TMDB, OMDb, Douban, Bangumi, MusicBrainz, and other services"
repository  = "https://github.com/tokimo-lab/tokimo-package-media-scraper"

[lib]
name = "tokimo_media_scraper"
path = "src/lib.rs"

[dependencies]
reqwest          = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies", "form", "query", "stream"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tokio            = { version = "1", features = ["sync", "time", "macros", "fs"] }
thiserror        = "2"
tracing          = "0.1"
scraper          = "0.26"
regex            = "1"
base64           = "0.22"
url              = "2"
hmac             = "0.13"
sha2             = "0.11"
futures-util     = "0.3"
percent-encoding = "2"
md-5             = "0.11"
hex              = "0.4"
zip              = { version = "8", default-features = false, features = ["deflate"] }
bytes            = "1"
rand             = "0.9"
urlencoding      = "2"
tokimo-web-fetch = { git = "https://github.com/tokimo-lab/tokimo-package-web-fetch.git", rev = "a56357f" }

[lints]
workspace = true
